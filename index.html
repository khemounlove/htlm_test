<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ប្រឡងគ្រូភាសាអង់គ្លេសកម្រិតខ្ពស់ 👲</title>
  <style>
    :root {
      --bg: #f3f6ff;
      --panel: #ffffff;
      --primary: #0031e3;
      --primary-dark: #0024c5;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --good: #16a34a;
      --bad: #dc2626;
      --warn: #f59e0b;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background-color: #e7edf7;
      background-image: url("images/1.png");
      background-position: center top;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Khmer OS Battambang", "Noto Sans Khmer", sans-serif;
      background: transparent;
      color: var(--text);
    }

    .topbar {
      background: transparent;
      color: var(--text);
      padding: 14px 20px;
      position: relative;
      z-index: 2;
    }

    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin: 0;
    }

    .badge {
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 4px 0;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 18px auto;
      padding: 0 16px 40px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
    }

    .sidebar,
    .card {
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .sidebar {
      padding: 12px 0;
      height: fit-content;
      position: sticky;
      top: 80px;
    }

    .filter-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    button,
    select {
      font-family: inherit;
    }

    .category-picker {
      position: relative;
    }

    #categoryToggle {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 0;
      border-bottom: 1px solid currentColor;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    #categoryToggle:hover,
    #categoryToggle[aria-expanded="true"] {
      border-color: var(--primary);
    }

    .category-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 30;
      display: grid;
      gap: 4px;
      max-height: min(55vh, 420px);
      overflow-y: auto;
      padding: 6px;
      border: 0;
      border-radius: 0;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: none;
    }

    .category-menu[hidden] {
      display: none;
    }

    .category-option {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .category-option:hover,
    .category-option[aria-pressed="true"] {
      background: rgba(45, 91, 255, 0.12);
      color: var(--primary-dark);
    }

    .questions {
      display: grid;
      gap: 16px;
    }

    .card {
      padding: 14px 0;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .category {
      background: transparent;
      color: inherit;
      border-radius: 0;
      padding: 0;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .qid {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
    }

    .question {
      font-size: 1rem;
      line-height: 1.5;
      margin: 0 0 14px;
      font-weight: 700;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      border: 0;
      border-bottom: 1px solid rgba(31, 41, 55, 0.2);
      background: transparent;
      color: var(--text);
      border-radius: 0;
      padding: 8px 4px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s ease;
      font-size: 0.92rem;
    }

    .option:hover {
      border-color: var(--primary);
      background: transparent;
    }

    .option.selected {
      border-color: var(--primary);
      background: transparent;
      color: var(--primary-dark);
    }

    .option .letter {
      min-width: 24px;
      height: 24px;
      border-radius: 0;
      background: transparent;
      color: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      margin-top: 1px;
    }

    .option.selected .letter {
      background: transparent;
      color: var(--primary-dark);
    }

    .answer-box {
      margin-top: 12px;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      display: none;
    }

    .answer-box.correct {
      color: var(--good);
      border: 0;
      display: block;
    }

    .answer-box.wrong {
      color: var(--bad);
      border: 0;
      display: block;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      padding: 4px 0 12px;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .word-bank-label {
      font-weight: 700;
      margin-right: 4px;
    }

    .word-chip {
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      font-size: 0.88rem;
    }

    .passage {
      margin: 0 0 14px;
      font-size: 1rem;
      line-height: 2.2;
    }

    .cloze-card {
      font-size: 0.88rem;
    }

    .cloze-card .question {
      font-size: 0.9rem;
    }

    .cloze-card .passage {
      font-size: 0.88rem;
      line-height: 2;
    }

    .cloze-card .word-chip {
      font-size: 0.78rem;
    }

    .cloze-card .answer-box {
      font-size: 0.74rem;
    }

    .cloze-card .status {
      font-size: 0.7rem;
    }

    .gap-select {
      width: auto;
      min-width: 150px;
      max-width: 100%;
      margin: 0 4px;
      padding: 6px 8px;
      font: inherit;
    }

    .check-cloze {
      min-height: 40px;
      padding: 0 14px;
      border: 0;
      border-bottom: 1px solid currentColor;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .status {
      margin-top: 10px;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .hint {
      margin: 12px 0 0;
      padding: 6px 0;
      border-left: 0;
      background: transparent;
      color: #713f12;
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .empty {
      display: none;
      text-align: center;
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 40px 20px;
      color: var(--muted);
      font-weight: 600;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 18px;
    }

    .pagination button {
      min-height: 42px;
      padding: 0 16px;
      border: 0;
      border-bottom: 1px solid currentColor;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .pagination button:disabled {
      border-color: transparent;
      background: transparent;
      color: rgba(31, 41, 55, 0.55);
      cursor: not-allowed;
    }

    #pageInfo {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .wrapper {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="title">Exam 👲</h1>
      <div id="totalBadge" class="badge"></div>
    </div>
  </header>

  <main class="wrapper">
    <aside class="sidebar">
      <span class="filter-label">Filter by Category</span>
      <div class="category-picker">
        <button id="categoryToggle" type="button" aria-expanded="false" aria-controls="categoryMenu">
          <span id="selectedCategory">គ្រប់ប្រភេទ</span>
          <span aria-hidden="true">▾</span>
        </button>
        <div id="categoryMenu" class="category-menu" role="group" aria-label="ប្រភេទសំណួរ" hidden></div>
      </div>
    </aside>

    <section>
      <div id="questions" class="questions"></div>
      <div id="empty" class="empty">រកមិនឃើញសំណួរសម្រាប់ប្រភេទនេះទេ។</div>
      <nav id="pagination" class="pagination" aria-label="ប្តូរទំព័រសំណួរ">
        <button id="previousPage" type="button">ទំព័រមុន</button>
        <span id="pageInfo"></span>
        <button id="nextPage" type="button">ទំព័របន្ទាប់</button>
      </nav>
    </section>
  </main>

  <script>
    const categories = [
      'វេយ្យាករណ៍ និងរចនាសម្ព័ន្ធ',
      'វាក្យសព្ទ និងភាសាសិក្សា',
      'វិធីសាស្ត្របង្រៀន',
      'ការវាយតម្លៃសិក្សា',
      'អត្ថបទបំពេញចន្លោះ',
      'ចំណេះដឹងទូទៅ និងកម្ពុជា',
      'គរុកោសល្យ និងក្រមសីលធម៌គ្រូ',
      'ICT និងកុំព្យូទ័រ',
      'ស្ថានការណ៍គរុកោសល្យ',
      'ភូមិសាស្ត្រកម្ពុជា',
      'វិទ្យាសាស្ត្រ និងធម្មជាតិ',
      'សង្គម និងវប្បធម៌',
      'ភាសា និងតក្កវិជ្ជា',
      'ចំណេះដឹងសម្រាប់ប្រឡង'
    ];

    function buildQuestion(id, category, question, options, correctIndex, hint = '') {
      return { id, category, question, options, correctIndex, hint };
    }

    function buildClozeQuestion(id, passage, wordBank, answers) {
      return {
        id,
        category: categories[4],
        question: 'ចូរបំពេញចន្លោះក្នុងអត្ថបទ ដោយជ្រើសរើសពាក្យពីប្រអប់។ ប្រើពាក្យនីមួយៗតែម្តង។',
        type: 'cloze',
        passage,
        wordBank,
        answers
      };
    }

    const questionBank = [];
    const examSections = [
      {
        category: categories[0],
        questions: [
          ['តើប្រយោគណាត្រឹមត្រូវក្រោយឃ្លាបញ្ច្រាស “Not until…”?', ['Not until the results were published, the committee understood the impact.', 'Not until were the results published did the committee understand the impact.', 'Not until the results were published did the committee understand the impact.', 'Not until the results published the committee did understand the impact.'], 2],
          ['បំពេញចន្លោះ៖ The panel recommended that each candidate ___ a research proposal.', ['submits', 'submit', 'submitted', 'will submit'], 1],
          ['បំពេញលក្ខខណ្ឌចម្រុះឱ្យត្រឹមត្រូវ៖ If Dara ___ the course last year, she ___ teaching now.', ['completed / would be', 'had completed / would be', 'would complete / had been', 'has completed / will be'], 1],
          ['ជ្រើសរើសប្រយោគដែលប្រើ participial clause ត្រឹមត្រូវ៖', ['Having reviewed the evidence, the examiner revised the rubric.', 'Reviewed the evidence, the rubric was revised by the examiner.', 'Having reviewed the evidence, the rubric was revised.', 'The examiner having review the evidence, revised the rubric.'], 0],
          ['តើប្រយោគណាមាន subject-verb agreement ត្រឹមត្រូវ?', ['Neither the mentor nor the trainees was prepared.', 'Neither the mentor nor the trainees were prepared.', 'Neither the mentor or the trainees were prepared.', 'Neither mentor nor trainees is prepared yesterday.'], 1],
          ['តើវណ្ណយុត្តិមួយណាត្រឹមត្រូវសម្រាប់ relative clause ដែលមិនកំណត់ន័យ?', ['The students who completed the task, received feedback.', 'The students, who completed the task received feedback.', 'The students, who completed the task, received feedback.', 'The students who, completed the task received feedback.'], 2],
          ['បំពេញចន្លោះដោយប្រើ modal verb សម្រាប់ការសន្និដ្ឋានខ្លាំងអំពីអតីតកាល៖ She ___ the email; I saw it in her sent folder.', ['must have sent', 'should send', 'might send', 'would be sending'], 0],
          ['បំពេញចន្លោះ៖ We regret ___ you that the application has been unsuccessful.', ['informing', 'to inform', 'inform', 'to have informing'], 1],
          ['ជ្រើសរើសប្រយោគដែលមាន parallel structure ត្រឹមត្រូវ៖', ['The role requires planning lessons, to assess learners, and communication with parents.', 'The role requires planning lessons, assessing learners, and communicating with parents.', 'The role requires to plan lessons, assessing learners, and parent communication.', 'The role requires lesson planning, assess learners, and to communicate with parents.'], 1],
          ['បំពេញចន្លោះក្នុង cleft sentence៖ It was the feedback ___ helped the novice teacher refine the lesson.', ['who', 'whose', 'that', 'what'], 2]
        ]
      },
      {
        category: categories[1],
        questions: [
          ['តើ collocation ណាប្រើបានត្រឹមត្រូវក្នុងការសរសេរបែបសិក្សា?', ['do a distinction', 'draw a distinction', 'make a distinction between of', 'take distinction'], 1],
          ['ក្នុងប្រយោគ “The findings are compelling, albeit preliminary,” ពាក្យ “albeit” មានន័យជិតនឹងអ្វី?', ['therefore', 'although', 'because', 'moreover'], 1],
          ['តើ “corroborate a claim” មានន័យដូចម្តេច?', ['បដិសេធការអះអាង', 'ផ្តល់ភស្តុតាងគាំទ្រការអះអាង', 'ធ្វើឱ្យការអះអាងមិនច្បាស់', 'សង្ខេបការអះអាង'], 1],
          ['តើកិរិយាសព្ទណាមានន័យថាកាត់បន្ថយភាពធ្ងន់ធ្ងរ ឬផលប៉ះពាល់?', ['mitigate', 'perpetuate', 'exacerbate', 'supersede'], 0],
          ['ក្នុងអត្ថបទសិក្សា “ubiquitous” មានន័យថា៖', ['កើតមានជាញឹកញាប់នៅកន្លែងជាច្រើន', 'មានភាពចម្រូងចម្រាសខ្លាំង', 'ពិបាកវាស់វែង', 'មានលក្ខណៈបណ្តោះអាសន្ន'], 0],
          ['តើ “ambiguous instruction” សំដៅលើអ្វី?', ['សេចក្តីណែនាំដែលមានន័យច្រើន ឬមិនច្បាស់', 'សេចក្តីណែនាំដែលមានឧទាហរណ៍ច្រើន', 'សេចក្តីណែនាំដែលខ្លីពេក', 'សេចក្តីណែនាំដែលមានលំដាប់ច្បាស់'], 0],
          ['តើ “infer” មានន័យអ្វីនៅពេលអានអត្ថបទ?', ['ចម្លងព័ត៌មានតាមពាក្យដើម', 'សន្និដ្ឋានពីភស្តុតាងដែលមាន', 'បកប្រែគ្រប់ពាក្យ', 'បដិសេធគំនិតរបស់អ្នកនិពន្ធ'], 1],
          ['តើមួយណាជាឧទាហរណ៍នៃ connotation អវិជ្ជមាន?', ['slim ជំនួស thin ក្នុងបរិបទសរសើរ', 'home ជំនួស house ក្នុងបរិបទកក់ក្តៅ', 'stubborn ជំនួស determined ក្នុងបរិបទរិះគន់', 'child ជំនួស student ក្នុងបរិបទសាលា'], 2],
          ['ពាក្យ “Could you possibly submit the draft today?” បង្ហាញ register បែបណា?', ['informal and blunt', 'formal and tactful', 'technical and impersonal', 'archaic and ceremonial'], 1],
          ['ក្នុងសំណេរអាគុយម៉ង់ “salient evidence” មានន័យថាភស្តុតាងដែល៖', ['មិនទាក់ទងនឹងប្រធានបទ', 'សំខាន់ និងពាក់ព័ន្ធដោយផ្ទាល់', 'ត្រូវបានប្រឌិត', 'ពិបាកអានតែគ្មានប្រយោជន៍'], 1]
        ]
      },
      {

          answerBox.textContent = text;
          answerBox.className = `answer-box ${correct ? 'correct' : 'wrong'}`;
          status.textContent = correct ? 'ចម្លើយត្រឹមត្រូវ' : 'ចម្លើយមិនត្រឹមត្រូវ';
        });
      });

      questionsContainer.querySelectorAll('.card').forEach((card) => {
        const gaps = [...card.querySelectorAll('.gap-select')];
        if (!gaps.length) return;

        const updateWordOptions = () => {
          const chosenWords = new Set(gaps.map(gap => gap.value).filter(Boolean));
          gaps.forEach((gap) => {
            [...gap.options].forEach((option) => {
              option.disabled = Boolean(option.value && option.value !== gap.value && chosenWords.has(option.value));
            });
          });
        };

        gaps.forEach(gap => gap.addEventListener('change', updateWordOptions));

        card.querySelector('.check-cloze').addEventListener('click', (event) => {
          const questionId = Number(event.currentTarget.dataset.qid);
          const question = questionBank.find(item => item.id === questionId);
          const answerBox = card.querySelector('.answer-box');
          const status = card.querySelector('.status');

          if (gaps.some(gap => !gap.value)) {
            answerBox.textContent = 'សូមបំពេញចន្លោះទាំងអស់ជាមុនសិន។';
            answerBox.className = 'answer-box wrong';
            status.textContent = 'នៅមានចន្លោះមិនទាន់បំពេញ';
            return;
          }

          const correctCount = gaps.filter((gap, index) => gap.value === question.answers[index]).length;
          const allCorrect = correctCount === question.answers.length;
          answerBox.textContent = allCorrect
            ? `ត្រឹមត្រូវទាំងអស់! ${toKhmerNumber(correctCount)} / ${toKhmerNumber(question.answers.length)}`
            : `ត្រឹមត្រូវ ${toKhmerNumber(correctCount)} / ${toKhmerNumber(question.answers.length)}។ ចម្លើយ៖ ${question.answers.join(' · ')}`;
          answerBox.className = `answer-box ${allCorrect ? 'correct' : 'wrong'}`;
          status.textContent = allCorrect ? 'អ្នកបានបំពេញត្រឹមត្រូវទាំងអស់' : 'សូមពិនិត្យចម្លើយឡើងវិញ';
        });
      });
    }

    function filterQuestions() {
      const filtered = selectedCategory === 'all'
        ? questionBank
        : questionBank.filter(item => item.category === selectedCategory);

      currentQuestions = filtered;
      currentPage = 0;
      renderQuestions(filtered);
    }

    previousPageButton.addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage -= 1;
        renderQuestions(currentQuestions);
      }
    });

    nextPageButton.addEventListener('click', () => {
      if (currentPage < Math.ceil(currentQuestions.length / pageSize) - 1) {
        currentPage += 1;
        renderQuestions(currentQuestions);
      }
    });

    const categoryOptions = [
      { value: 'all', label: 'គ្រប់ប្រភេទ' },
      ...categories.map(category => ({ value: category, label: category }))
    ];

    categoryOptions.forEach(({ value, label }) => {
      const option = document.createElement('button');
      option.className = 'category-option';
      option.type = 'button';
      option.dataset.category = value;
      option.textContent = label;
      option.setAttribute('aria-pressed', String(value === selectedCategory));
      option.addEventListener('click', () => {
        selectedCategory = value;
        selectedCategoryLabel.textContent = label;
        categoryMenu.querySelectorAll('.category-option').forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.category === selectedCategory));
        });
        categoryMenu.hidden = true;
        categoryToggle.setAttribute('aria-expanded', 'false');
        filterQuestions();
      });
      categoryMenu.appendChild(option);
    });

    categoryToggle.addEventListener('click', () => {
      const isExpanded = categoryToggle.getAttribute('aria-expanded') === 'true';
      categoryToggle.setAttribute('aria-expanded', String(!isExpanded));
      categoryMenu.hidden = isExpanded;
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.category-picker')) {
        categoryMenu.hidden = true;
        categoryToggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !categoryMenu.hidden) {
        categoryMenu.hidden = true;
        categoryToggle.setAttribute('aria-expanded', 'false');
        categoryToggle.focus();
      }
    });

    const backgroundImages = ['images/1.png', 'images/2.png', 'images/3.png'];
    let currentBackgroundIndex = 0;

    backgroundImages.forEach((imagePath) => {
      const image = new Image();
      image.src = imagePath;
    });

    window.setInterval(() => {
      currentBackgroundIndex = (currentBackgroundIndex + 1) % backgroundImages.length;
      document.documentElement.style.backgroundImage = `url("${backgroundImages[currentBackgroundIndex]}")`;
    }, 10000);

    renderQuestions(questionBank);
  </script>
</body>
</html>
